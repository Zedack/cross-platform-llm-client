name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # O projeto compila os shaders do Vulkan com um glslc moderno, procurado
      # em /usr/local/bin ou em $VULKAN_SDK. Sem ele, cai no glslc antigo do
      # NDK, que nao entende "cooperative matrix" e derruba o build.
      - name: Install a modern glslc
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y glslc
          sudo ln -sf "$(command -v glslc)" /usr/local/bin/glslc
          glslc --version

          cat > "$RUNNER_TEMP/coopmat_test.comp" <<'EOF'
          #version 450
          #extension GL_KHR_cooperative_matrix : enable
          #extension GL_KHR_memory_scope_semantics : enable
          #extension GL_KHR_shader_subgroup_basic : enable
          layout(local_size_x = 64) in;
          void main() {
              coopmat<float, gl_ScopeSubgroup, 16, 16, gl_MatrixUseAccumulator> m;
          }
          EOF

          out=$(glslc -fshader-stage=compute --target-env=vulkan1.3 \
                "$RUNNER_TEMP/coopmat_test.comp" -o /dev/null 2>&1 || true)
          echo "coopmat test output: [$out]"

          if echo "$out" | grep -qiE "not supported|error"; then
            echo "apt glslc is too old for cooperative matrix; trying the LunarG Vulkan SDK"
            curl -fsSL -o "$RUNNER_TEMP/vulkan-sdk.tar.xz" \
              "https://sdk.lunarg.com/sdk/download/latest/linux/vulkan-sdk.tar.xz"
            mkdir -p "$HOME/vulkan-sdk"
            tar -xf "$RUNNER_TEMP/vulkan-sdk.tar.xz" -C "$HOME/vulkan-sdk"
            GLSLC=$(find "$HOME/vulkan-sdk" -name glslc -type f | head -1)
            test -n "$GLSLC"
            sudo ln -sf "$GLSLC" /usr/local/bin/glslc
            glslc --version
            out=$(glslc -fshader-stage=compute --target-env=vulkan1.3 \
                  "$RUNNER_TEMP/coopmat_test.comp" -o /dev/null 2>&1 || true)
            echo "coopmat test output after SDK: [$out]"
            if echo "$out" | grep -qiE "not supported|error"; then
              echo "Still no cooperative matrix support in glslc"
              exit 1
            fi
          fi

      - run: flutter pub get

      # So arm64 (celulares atuais): metade do tempo e do tamanho. O app aceita
      # assinar o release com a chave de debug (so para uso pessoal).
      - name: Build APK
        env:
          PRIVATELM_ALLOW_DEBUG_RELEASE_SIGNING: "true"
        run: flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: PrivateLM-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
